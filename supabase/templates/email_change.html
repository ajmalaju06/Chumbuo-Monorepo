<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      background: #e8dcc6;
      font-family: Helvetica, Arial, sans-serif;
      color: #1f3b2e;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="padding: 48px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px; background: #f3ecdf; padding: 40px 36px"
          >
            <tr>
              <td
                style="
                  font-family: Georgia, &quot;Times New Roman&quot;, serif;
                  font-size: 28px;
                  letter-spacing: -0.5px;
                  padding-bottom: 28px;
                "
              >
                Chumbuo
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-family: Georgia, &quot;Times New Roman&quot;, serif;
                  font-size: 24px;
                  line-height: 1.25;
                  padding-bottom: 16px;
                "
              >
                Confirm your new email.
              </td>
            </tr>
            <tr>
              <td style="font-size: 15px; line-height: 1.6; padding-bottom: 28px">
                Confirm that you want to use {{ .NewEmail }} to sign in to Chumbuo.
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 28px">
                <a
                  href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/admin/account"
                  style="
                    display: inline-block;
                    background: #1f3b2e;
                    color: #e8dcc6;
                    text-decoration: none;
                    font-size: 14px;
                    letter-spacing: 1px;
                    padding: 14px 26px;
                    border-radius: 999px;
                  "
                  >Confirm new email</a
                >
              </td>
            </tr>
            <tr>
              <td style="font-size: 12px; line-height: 1.6; color: #4b5f55">
                If you didn’t ask for this change, sign in and change your password.
              </td>
            </tr>
          </table>
          <p
            style="
              font-size: 11px;
              letter-spacing: 2px;
              text-transform: uppercase;
              color: #1f3b2e;
              margin-top: 24px;
            "
          >
            Little moments. Lasting stories.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
